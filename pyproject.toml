[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-voice-transcriber"
version = "0.1.0"
description = "Personal Telegram userbot that auto-transcribes voice notes in 1-on-1 chats using faster-whisper locally."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "rust" }]
keywords = ["telegram", "userbot", "whisper", "transcription", "telethon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "telethon>=1.43,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.1",
    "httpx>=0.27,<1.0",
    "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Transcription dependencies are added in Phase 3 to keep Phase 1 light.
# whisper = ["faster-whisper>=1.2,<2.0"]

[project.scripts]
tg-voice-transcriber = "tg_voice_transcriber.__main__:_sync_main"

[project.urls]
Homepage = "https://github.com/yourname/telegram-voice-transcriber"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_voice_transcriber"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # handled by formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
